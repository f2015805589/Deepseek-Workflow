# DeepSeek Desktop surface overlay, applied last over the web profile by the
# desktop main process. The Electron window owns URL display: the webserver
# binds a loopback OS-assigned port (no fixed-port collision with `dsh web`)
# and the web-runtime row stays quiet instead of printing the URL line. The
# main process reads the bound port from the webServer service itself.
#
# The desktop shell ships no product plugins of its own: the window renders
# the composed web profile exactly as the browser does. (Earlier revisions
# injected desktop-owned companion plugins here — compaction setting,
# conversation edit, fs revert, plugin manager — but those packages were lost
# and are no longer shipped; nothing in this overlay may reference them.)
#
# A patch replaces the targeted row's whole config, so each row below
# restates every key it owns (the web bundle's rows are the source).

- id: webserver
  inject: [webStartup]
  config:
    host: '127.0.0.1'
    port: 0

- id: web-runtime
  inject: [webStartup]
  config:
    printUrl: false
    surfaceContext: true
    trustedHosts: !!js ctx.webStartup.trustedHosts
