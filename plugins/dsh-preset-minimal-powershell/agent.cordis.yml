# The `minimal-powershell` plugin preset: the shipped `minimal` composition
# with the persistent Linux bash stack replaced by the Windows PowerShell tool.
#
# The model-facing catalog stays exactly the shipped minimal two tools:
# `pwsh` + `str_replace_editor`. The persona row is byte-identical to
# `minimal` (complete system prompt, no runtime-context snapshot), and the
# filesystem group is byte-identical too. No compaction group is mounted.
#
# There is no persistent PowerShell PTY backend today (`tool-pwsh` runs every
# call in a fresh `pwsh -Command` process), so this preset uses the shipped
# PowerShell twin and disables `run_in_background`: the minimal catalog must
# not advertise job handles when the `job_*` controls are deliberately absent.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: You are a helpful software engineer assistant.
    complete: true
    includeRuntimeContext: false

# The web host composition already mounts the pwsh sandbox executor behind the
# `shell` seam on Windows and the shared jobs registry; the model-facing row is
# all a preset owns. Gate the row exactly like the shipped `standard` preset so
# a non-Windows host never registers a PowerShell-named tool over the bash
# executor.
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
  config:
    enableRunInBackground: false

# The bare local filesystem shadows the host's sandboxed provider only for this
# preset. The editor shares that realm and requires absolute paths.
- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000
